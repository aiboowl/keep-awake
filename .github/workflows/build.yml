name: Build and release macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test recovery without changing power settings
        run: python3 -m unittest discover -s tests -v
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/macos-keep-awake/Info.plist)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Build universal app
        run: bash scripts/build.sh
      - name: Package app
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KeepAwake-universal
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeepAwake-universal
          path: dist
      - name: Publish release if it does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Не засыпать $RELEASE_TAG" --notes 'Универсальное приложение для macOS 13+: Apple Silicon и Intel. Инструкция по установке — в README. Подпись ad hoc, без нотариализации Apple.'
          fi
